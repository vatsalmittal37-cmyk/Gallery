name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK with Buildozer
        run: |
          buildozer init
          sed -i 's/android.api = 27/android.api = 33/g' buildozer.spec
          
          # Force accept all Android SDK licenses automatically
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | jq -r 'if type=="string" then . else empty end' 2>/dev/null || true
          
          buildozer android debug
